<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navigation Bar</title>
  <style>
    /* Reset & Base Layout */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
    }

    /* Navbar Styling */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0f172a;
      padding: 1rem 2rem;
      position: relative;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
    }

    /* Desktop Navigation Links */
    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    .nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #38bdf8;
    }

    /* Checkbox & Hamburger Toggle Elements */
    #menu-toggle {
      display: none;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .hamburger span {
      width: 24px;
      height: 3px;
      background-color: #ffffff;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* Responsive Mobile Styles */
    @media (max-width: 768px) {
      .hamburger {
        display: flex;
      }

      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        background-color: #0f172a;
        position: absolute;
        top: 100%;
        left: 0;
        padding: 1rem 0;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .nav-links li {
        text-align: center;
      }

      .nav-links a {
        display: block;
        padding: 0.75rem 0;
      }

      /* Displays the menu when the hamburger checkbox is activated */
      #menu-toggle:checked ~ .nav-links {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo">Brand</a>
    
    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="hamburger" aria-label="Toggle Navigation">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

</body>
</html>
